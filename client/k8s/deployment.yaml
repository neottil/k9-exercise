# ${CLIENT_IMAGE} viene sostituito dalla GitHub Action con envsubst.
# Il client e' nginx statico — non ha autoscaling, 1 replica e' sufficiente.
# Rollback manuale: kubectl rollout undo deployment/k9-client -n k9
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k9-client
  namespace: k9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k9-client
  template:
    metadata:
      labels:
        app: k9-client
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: client
          image: ${CLIENT_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            # Montata come DIRECTORY, non con subPath: con subPath kubelet non
            # propaga più gli aggiornamenti della ConfigMap al file nel
            # container. nginx serve la dir come /config/, quindi il client
            # trova la sua configurazione su /config/config.json.
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config
              readOnly: true
            # Versioni deployate: la ConfigMap k9-versions è già l'unica fonte
            # di verità, patchata da deploy-client/deploy-server/infra ognuno
            # sulla propria chiave. Montandola qui il client la legge senza
            # passare dal server, e kubelet ne propaga gli aggiornamenti anche
            # quando a deployare è un altro scope.
            - name: versions
              mountPath: /usr/share/nginx/html/versions
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: runtime-config
          configMap:
            name: k9-client-config
        - name: versions
          configMap:
            name: k9-versions
            # optional: k9-versions è creata da infra.yml. Senza questo flag un
            # cluster non ancora provisionato bloccherebbe l'avvio del pod;
            # così al massimo la pagina Info mostra "N/A".
            optional: true
