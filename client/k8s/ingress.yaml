# Traefik e' l'ingress controller incluso di default in k3s.
# Questo Ingress instrada tutto tranne /api (vedi server/k8s/ingress.yaml) al
# client nginx che serve la React SPA.
#
# ${DOMAIN} viene sostituito dalla GitHub Action con envsubst.
# Imposta la GitHub Variable DOMAIN con il tuo sottodominio (es. k9.tuodominio.com).
#
# TLS: questo Ingress e' l'UNICO dei due (client/server) a portare l'annotation
# cert-manager.io/cluster-issuer — cert-manager gestisce un solo Certificate per
# host/secretName condiviso; server/k8s/ingress.yaml referenzia lo stesso
# secretName senza richiederlo di nuovo (vedi nota in server/k8s/ingress.yaml).
# Durante il provisioning iniziale il sito risponde anche su HTTP (web,websecure).
# Dopo che il certificato e' emesso, HTTPS e' attivo automaticamente.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k9-client-ingress
  namespace: k9
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - ${DOMAIN}
      secretName: k9-tls
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k9-client
                port:
                  number: 80
