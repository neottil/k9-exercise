name: Promote to Production

# Attivazione MANUALE: deploya in produzione una o entrambe le versioni reali
# già create dal workflow Tag (client-vX.Y.Z / server-vX.Y.Z). SOLO deploy:
# non crea né sposta tag, non tocca la GitHub Release, non decide nessuna
# versione da solo — riceve la versione come input esplicito.
#
# Separazione netta rispetto a tag.yml: Tag decide "quale versione esiste",
# Promote decide "quale versione gira in produzione ora". Possono succedere in
# momenti diversi (es. taggi 1.6.0 oggi, promuovi in produzione la prossima
# settimana), e Promote può essere rilanciato in qualunque momento con la
# stessa versione per risincronizzare la produzione (es. dopo un deploy
# fallito) senza dover ripassare da Tag.
#
# Il deploy vero e proprio è delegato agli STESSI workflow riutilizzabili usati
# da build-deploy.yml per staging (deploy-client.yml/deploy-server.yml, con
# environment: production) — nessuna logica di deploy duplicata qui.
on:
  workflow_dispatch:
    inputs:
      server_version:
        description: 'Versione server da deployare in produzione (es. 1.6.0 — deve esistere come tag server-v<versione>, creato dal workflow Tag). Vuoto = non toccare il server.'
        required: false
        default: ''
      client_version:
        description: 'Versione client da deployare in produzione (es. 1.6.0 — deve esistere come tag client-v<versione>, creato dal workflow Tag). Vuoto = non toccare il client.'
        required: false
        default: ''

jobs:
  # Nessun deploy alla cieca: verifica che almeno una versione sia stata
  # specificata e che il tag di versione reale corrispondente esista davvero
  # (creato da tag.yml) — un typo o una versione mai taggata falliscono qui,
  # non a metà di un deploy su un ambiente reale.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verifica input e tag di versione
        run: |
          if [ -z "${{ inputs.server_version }}" ] && [ -z "${{ inputs.client_version }}" ]; then
            echo "::error::Specifica almeno server_version o client_version."
            exit 1
          fi

          if [ -n "${{ inputs.server_version }}" ]; then
            if ! git rev-parse -q --verify "refs/tags/server-v${{ inputs.server_version }}" >/dev/null; then
              echo "::error::Tag server-v${{ inputs.server_version }} non trovato. Lancia prima il workflow Tag."
              exit 1
            fi
          fi

          if [ -n "${{ inputs.client_version }}" ]; then
            if ! git rev-parse -q --verify "refs/tags/client-v${{ inputs.client_version }}" >/dev/null; then
              echo "::error::Tag client-v${{ inputs.client_version }} non trovato. Lancia prima il workflow Tag."
              exit 1
            fi
          fi

  deploy-production-client:
    needs: validate
    if: inputs.client_version != ''
    uses: ./.github/workflows/deploy-client.yml
    with:
      environment: production
      image_tag: ${{ inputs.client_version }}
    secrets: inherit

  deploy-production-server:
    needs: validate
    if: inputs.server_version != ''
    uses: ./.github/workflows/deploy-server.yml
    with:
      environment: production
      image_tag: ${{ inputs.server_version }}
    secrets: inherit

  summary:
    needs: [validate, deploy-production-client, deploy-production-server]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Job summary
        run: |
          status_icon() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              skipped)  echo "⏭️" ;;
              *)        echo "⏳" ;;
            esac
          }

          {
            echo "## Promote to Production"
            echo ""
            echo "| Componente | Versione | Stato |"
            echo "|---|---|---|"
            echo "| client | \`${{ inputs.client_version || '—' }}\` | $(status_icon "${{ needs.deploy-production-client.result }}") |"
            echo "| server | \`${{ inputs.server_version || '—' }}\` | $(status_icon "${{ needs.deploy-production-server.result }}") |"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Avviato da** | ${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
